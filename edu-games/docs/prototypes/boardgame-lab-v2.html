<div class="e-app" aria-label="게임 방식 비교">
 <header class="e-top"><span class="e-brand">EDU PLAY</span><span class="e-board-no" id="eb-seed"></span></header>
 <nav class="e-tabs" role="tablist" aria-label="게임 선택">
  <button type="button" role="tab" id="eb-tab-market" aria-controls="eb-panel" data-game="market"><i data-lucide="palette" aria-hidden="true"></i>픽셀 마켓</button>
  <button type="button" role="tab" id="eb-tab-race" aria-controls="eb-panel" data-game="race"><i data-lucide="package" aria-hidden="true"></i>스택 스프린트</button>
  <button type="button" role="tab" id="eb-tab-night" aria-controls="eb-panel" data-game="night"><i data-lucide="moon-star" aria-hidden="true"></i>밤의 관측소</button>
 </nav>
 <section id="eb-panel" role="tabpanel">
  <div class="e-heading"><div><h1 id="eb-title"></h1><p id="eb-goal"></p></div><div class="e-row"><button type="button" class="e-icon" data-act="retry" aria-label="같은 판 다시 도전" data-tooltip="같은 판 다시 도전"><i data-lucide="rotate-ccw" aria-hidden="true"></i></button><button type="button" class="e-icon" data-act="new" aria-label="새 판" data-tooltip="새 판"><i data-lucide="shuffle" aria-hidden="true"></i></button></div></div>
  <div class="e-hud" id="eb-hud"></div>
  <div class="e-board" id="eb-board"></div>
  <div class="e-controls" id="eb-controls"></div>
  <div class="e-feedback" id="eb-feedback" role="status" aria-live="polite"></div>
  <div id="eb-result"></div>
 </section>
</div>
<script>
/* ENGINE_START */
(function (root, factory) {
  const api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  else root.EduBoardLab = api;
})(typeof globalThis === 'object' ? globalThis : this, function () {
  'use strict';
  const copy = v => JSON.parse(JSON.stringify(v));
  const sum = a => a.reduce((n, v) => n + v, 0);
  function random(seed) {
    let x = (seed >>> 0) || 1;
    const next = () => { x ^= x << 13; x ^= x >>> 17; x ^= x << 5; return (x >>> 0) / 4294967296; };
    for (let i=0; i<8; i++) next();
    return next;
  }
  function shuffle(a, r) {
    a = a.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }
  const patterns = [
    { name: '로켓', rows: ['00011000','00122100','01233210','01233210','01222210','12222221','00144100','00044000'], needs: [5,2,1] },
    { name: '물고기', rows: ['00011100','00133310','10131431','11333331','10133310','00133210','00122100','00011000'], needs: [2,5,1] },
    { name: '꽃', rows: ['00444400','04444440','04422440','00444400','00033000','00333000','03333000','00033000'], needs: [1,2,5] }
  ];
  function createMarket(seed) {
    const r = random(seed);
    const paintings = patterns.map(p => {
      const target = p.rows.join('').split('').map(Number), mask = [];
      p.needs.forEach((n, k) => mask.push(...shuffle(target.map((c,i) => c === k + 2 ? i : -1).filter(i => i >= 0), r).slice(0,n)));
      const board = target.slice(); mask.forEach(i => { board[i] = null; });
      return { name: p.name, target, mask, board };
    });
    const deck = shuffle(Array.from({length:45},(_,i) => ({color:2+i%3,count:2+Math.floor(r()*3)})),r);
    return { seed, round:0, maxRounds:10, paintings, market:deck.slice(0,3), deck, deckAt:3, stock:[0,0,0,0,0], selected:0, color:2, waste:0, undo:null, done:false, last:'그림 두 장 완성 · 남은 물감은 여섯 방울까지' };
  }
  function marketInfo(s) {
    const completed = s.paintings.filter(p => p.mask.every(i => p.board[i] === p.target[i])).length;
    const correct = sum(s.paintings.map(p => p.mask.filter(i => p.board[i] === p.target[i]).length));
    return { completed, correct, score: completed * 10 + correct - s.waste, win:completed >= 2 };
  }
  function marketMove(s, a) {
    if (a.type === 'select' && s.paintings[a.index]) s.selected = a.index;
    else if (a.type === 'color' && a.color >= 2 && a.color <= 4) s.color = a.color;
    else if (a.type === 'take' && s.round < s.maxRounds && s.market[a.index]) {
      const p = s.market[a.index], n = Math.min(p.count, 6-sum(s.stock));
      s.stock[p.color] += n; s.waste += p.count - n; s.round++; s.undo = null;
      s.market[a.index] = s.deck[s.deckAt++]; s.color = p.color;
      s.last = `물감 ${n}방울 확보${n < p.count ? ` · 넘친 ${p.count-n}방울은 버림` : ''}`;
    } else if (a.type === 'refresh' && s.round < s.maxRounds) {
      s.market = s.deck.slice(s.deckAt, s.deckAt+3); s.deckAt += 3; s.round++; s.undo = null;
      s.last = '한 차례를 써서 물감을 모두 새로 받았습니다';
    } else if (a.type === 'discard' && s.stock[s.color]>0) {
      const n=s.stock[s.color];s.stock[s.color]=0;s.waste+=n;s.undo=null;
      s.last=`${s.color}번 물감 ${n}방울 비움 · 보관 공간 확보`;
    } else if (a.type === 'paint') {
      const p = s.paintings[s.selected], i = a.index;
      if (!p.mask.includes(i) || !s.stock[s.color] || p.board[i] === s.color) return s;
      s.undo = { painting:s.selected, index:i, before:p.board[i], color:s.color };
      p.board[i] = s.color; s.stock[s.color]--;
      const complete = p.mask.every(j => p.board[j] === p.target[j]);
      s.last = complete ? `${p.name} 완성 · +10점` : p.target[i] === s.color ? '행의 숫자와 색이 맞았습니다' : '이 칸의 색이 행 코드와 다릅니다';
    } else if (a.type === 'undo' && s.undo) {
      const u = s.undo; s.paintings[u.painting].board[u.index] = u.before; s.stock[u.color]++; s.undo = null;
      s.last = '마지막 붓질 취소 · 물감 회수';
    } else if (a.type === 'finish' && (s.round >= s.maxRounds || marketInfo(s).completed >= 2)) {
      s.done = true; s.last = marketInfo(s).win ? '그림 전시 성공' : '이번 전시는 미완성 · 같은 물감으로 다시 도전';

  }

  const ops = ['pushS','pushQ','popS','popQ','return'];
  const opNames = {pushS:'위로 넣기',pushQ:'뒤로 넣기',popS:'위에서 꺼내기',popQ:'앞에서 꺼내기',return:'출고 취소'};
  const pairKeys = ['AA','AB','AC','BA','BB','BC','CA','CB','CC'];
  function freshOrder(s) {

      const c = s.orderDeck[s.deckAt++ % s.orderDeck.length];
      if (!s.orders.some(p => p && p.key === c.key)) return copy(c);

  }
  function legal(p, op) {

      : op === 'pushQ' ? p.feed.length > 0 && p.queue.length < 4
      : op === 'popS' ? p.stack.length > 0 && p.out.length < 2

    if (op === 'popQ') p.out.push(p.queue.shift());

        if (value > best) { best = value; plan = path; }
        return;
      }

        if (!legal(p,op)) continue;

    return plan;
  }
  function createRace(seed) {
    const r = random(seed), pawn = () => ({stack:['A','B'],queue:['C'],feed:['A','C','B'],out:[],score:0,claimed:[]});
    const orderDeck = shuffle(Array.from({length:54},(_,i)=>({key:pairKeys[i%9],points:3+(i%3)})),r);
    const s = {seed,round:0,maxRounds:8,you:pawn(),bot:pawn(),orders:[{key:'BA',points:3},{key:'AC',points:4},{key:'CB',points:5}],orderDeck,deckAt:0,plan:[],botPlan:[],trace:[],supply:Array.from({length:8},()=>['A','B','C'][Math.floor(r()*3)]),done:false,last:'주문은 공용 · 먼저 꺼낸 쪽이 가져갑니다'};

  }
  function raceInfo(s) {

  }

  }

  function createNight(seed) {

    const metadata = !s.inspected[i] ? '원본 설정 미확인' : d.fault === 'unit' ? '단위: °F · 설정이 계속 유지됨' : d.fault === 'stuck' ? '센서: 같은 42를 반복 전송 중' : d.fault === 'spike' ? '기록: 이번 전송에만 잡음' : '단위: °C · 장비 정상';

  function nightMove(s,a) {
    const i = s.selected;
    if (a.type === 'select' && a.index>=0 && a.index<3) s.selected = a.index;
    else if (a.type === 'hold') {s.held[i] = !s.held[i];s.last=s.held[i]?'이번 값만 보류 · 다음 밤 센서는 그대로':'측정값 사용으로 복귀';}
    else if (a.type === 'inspect' && s.budget>=1 && !s.inspected[i]) {s.budget--;s.inspected[i]=true;s.last=sourceNote(s,i).metadata;}
    else if (a.type === 'measure' && s.budget>=1 && s.checked[i]===null) {s.budget--;s.checked[i]=s.world[s.night][i].truth;s.last='독립 장비로 다시 측정 · 이번 밤만 대체';}
    else if ((a.type === 'unit' || a.type === 'restart') && s.budget>=2 && s.fixes[i]!==a.type) {s.budget-=2;s.fixes[i]=a.type;s.last=a.type==='unit'?'화씨→섭씨 변환 적용 · 다음 밤에도 유지':'센서 재시작 · 반복 전송 오류를 복구';}
    else if (a.type === 'close') {
      const results = s.world[s.night].map((d,j)=>{
        const used = !s.held[j], correct = Math.abs(reading(s,j)-d.truth)<.2;

        if (d.event) {if(used&&correct)s.eventKept++;else s.eventMissed++;}
        return {name:s.names[j],value:reading(s,j),truth:d.truth,used,correct,event:d.event};
      });
      s.history.push(results);s.night++;
      s.last = `${results.filter(d=>d.used&&d.correct).length}/3개 정확 · ${results.filter(d=>d.used&&!d.correct).length}개 잘못 사용`;
      s.checked=[null,null,null];s.held=[false,false,false];s.done=s.night>=s.maxNights;
    }
    return s;
  }
  function create(game,seed=17) {
    return game==='market'?createMarket(seed):game==='race'?createRace(seed):createNight(seed);
  }
  function move(game,state,action,onStep) {
    if (state.done && !['select','color'].includes(action.type)) return state;
    const s = copy(state);
    return game==='market'?marketMove(s,action):game==='race'?raceMove(s,action,onStep):nightMove(s,action);
  }
  function info(game,s) {return game==='market'?marketInfo(s):game==='race'?raceInfo(s):nightInfo(s);}
  return {create,move,info,preview,legal,ops,opNames,reading,sourceNote,botPlan,copy};
});

 function night(){
  const s=states.night,view=s.done?{...s,night:3,checked:s.history[3].map(v=>v.value),held:s.history[3].map(v=>!v.used)}:s,n=E.sourceNote(view,s.selected);
  return `<div class="e-night-track" aria-label="네 밤 진행">${[0,1,2,3].map(i=>`<span class="${i===Math.min(s.night,3)?'current':''}">${i+1}밤</span>`).join('')}</div><div class="e-stations">${s.names.map((name,i)=>{const v=E.reading(view,i),range=s.kind===3&&i===s.culprit?[40,47]:[22,26],odd=v<range[0]||v>range[1];return `<button type="button" class="e-station" data-act="station" data-index="${i}" aria-pressed="${s.selected===i}"><span class="e-held">${view.held[i]?'보류':''}</span><canvas width="48" height="32" data-building="${i}" aria-hidden="true"></canvas><span>${name}</span><b>${v}</b><span class="e-warning">${odd?'평소 범위 밖':'평소 범위 안'}</span><span class="e-small">표시 단위 °C</span></button>`;}).join('')}</div><div class="e-inspector"><div class="e-row e-spread"><b style="font-weight:500">${s.names[s.selected]}</b><span class="e-small">${view.held[s.selected]?'이번 값 보류':'측정값 사용'}</span></div><span class="e-small">${n.context}</span><span class="e-small">${n.metadata}</span></div><div class="e-toolbox">${button(ico('scan-line')+'다시 재기 <span class="e-cost">1</span>','measure',s.done||s.budget<1||s.checked[s.selected]!==null?'disabled':'data-tooltip="이번 밤만 독립 장비의 값으로 대체"')}${button(ico('notebook-tabs')+'설정 보기 <span class="e-cost">1</span>','inspect',s.done||s.budget<1||s.inspected[s.selected]?'disabled':'')}${button(ico('thermometer')+'°C로 변환 <span class="e-cost">2</span>','unit',s.done||s.budget<2||s.fixes[s.selected]==='unit'?'disabled':'data-tooltip="화씨를 섭씨로 변환, 다음 밤에도 유지"')}${button(ico('wrench')+'재시작 <span class="e-cost">2</span>','restart',s.done||s.budget<2||s.fixes[s.selected]==='restart'?'disabled':'data-tooltip="반복 전송 고장을 수리"')}${button(ico('archive')+(s.held[s.selected]?'다시 사용':'이번 값 보류'),'hold',s.done?'disabled':'')}</div><div class="e-rule">보류하면 고쳐지지 않습니다 · 실제 고온도 버리지 않기</div>`;
 }
 function result(s){if(!s.done)return '';const f=E.info(game,s),win=f.win,draw=f.result==='draw',title=game==='race'?(win?'로봇보다 먼저 해냈어요':draw?'무승부 · 다음엔 한 주문 더':'이번엔 로봇의 승리'):game==='market'?(win?'전시 성공':'전시 미완성'):(win?'네 밤의 관측 성공':'관측 기록을 다시 살펴보세요');const detail=game==='market'?`그림 ${f.completed}장 · 맞는 칸 ${f.correct} · 넘친 물감 ${s.waste}`:game==='race'?`나 ${s.you.score} : ${s.bot.score} 로봇 · 8라운드`: `정확 ${s.accepted}/12 · 잘못 사용 ${s.bad} · 고온 경보 누락 ${s.eventMissed} · 남은 도구 ${s.budget}`;return `<section class="e-result ${win||draw?'':'fail'}" aria-label="게임 결과"><div><h2>${title}</h2><p>${detail}</p></div><b>${f.score}점</b><div class="e-row">${button(ico('rotate-ccw')+'같은 판 재도전','retry','',true)}${button(ico('shuffle')+'새 판','new')}</div></section>`;}
 function render(){
  root.querySelectorAll('.e-tabs button,.e-heading button').forEach(b=>b.disabled=playing);
  const s=states[game],f=E.info(game,s);$('#eb-title').textContent=names[game][0];$('#eb-goal').textContent=names[game][1];$('#eb-seed').textContent='보드 '+s.seed+' · 같은 판 최고 '+(best[game+':'+s.seed]??'-');$('#eb-panel').setAttribute('aria-labelledby','eb-tab-'+game);
  root.querySelectorAll('[data-game]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.game===game)));
  const hud=game==='market'?[['완성',f.completed+' / 2'],['가져오기',s.round+' / 10'],['점수',f.score]]:game==='race'?[['나',s.you.score],['로봇',s.bot.score],['라운드',Math.min(s.round+1,8)+' / 8']]:[['남은 도구',s.budget+' / 6'],['정확한 기록',s.accepted+' / 12'],['밤',Math.min(s.night+1,4)+' / 4']];
  $('#eb-hud').innerHTML=hud.map(([l,v])=>`<div><span>${l}</span><b>${esc(v)}</b></div>`).join('');$('#eb-board').innerHTML=({market,race,night}[game])();
  let controls='';if(!s.done){if(game==='market')controls=button(ico('undo-2'),'undo',`class="e-icon" aria-label="마지막 붓질 취소" data-tooltip="마지막 붓질 취소" ${!s.undo?'disabled':''}`)+button(ico('refresh-cw')+'물감 교체 · 1차례','refresh',s.round>=10?'disabled':'')+((s.round>=10||f.completed>=2)?button(ico('flag')+'전시 마감','finish','',true):'');if(game==='race'){const p=E.preview(s).player;controls=E.ops.map(op=>button(ico(op==='return'?'undo-2':op.startsWith('push')?'arrow-down-to-line':'arrow-up-from-line')+(op==='return'?'':({pushS:'스택 넣기',pushQ:'큐 넣기',popS:'스택 꺼내기',popQ:'큐 꺼내기'}[op])),'plan',`data-op="${op}" ${op==='return'?'aria-label="출고 취소" data-tooltip="출고를 취소하고 입고 뒤로 돌리기"':''} ${s.plan.length>=3||!E.legal(p,op)?'disabled':''}`)).join('')+button(ico('delete'),'undo',`aria-label="마지막 예약 취소" ${!s.plan.length?'disabled':''}`)+button(ico('play')+'동시 실행','resolve',!s.plan.length?'disabled':'',true);}if(game==='night')controls=button(ico('moon-star')+(s.night===3?'관측 마치기':'밤 마치기'),'close','',true);}
  $('#eb-controls').innerHTML=controls;$('#eb-feedback').textContent=s.last;$('#eb-result').innerHTML=result(s);paint();root.querySelectorAll('button').forEach(b=>{b.classList.add('cursor-interaction');if(playing)b.disabled=true;});if(playing){const slot=root.querySelectorAll('.e-plan>div')[playStep],actor=root.querySelectorAll('.e-player-title')[playActor==='you'?0:1];if(slot)slot.style.background='var(--e-green-soft)';if(actor)actor.style.color='var(--e-green)';}if(window.lucide)window.lucide.createIcons();
 }
 function paint(){
  if(playing){const note=$('.e-board .e-note>span');if(note)note.textContent=`${playStep+1}번째 명령 실행 중`;root.querySelectorAll('.e-plan>div.bad').forEach(el=>el.classList.remove('bad'));}
  root.querySelectorAll('.e-station').forEach(b=>{const s=states.night,i=+b.dataset.index,n=Math.min(s.night,3),v=s.done?s.history[n][i].value:E.reading(s,i),range=s.kind===3&&i===s.culprit?[40,47]:[22,26];b.querySelector('.e-warning').dataset.odd=String(v<range[0]||v>range[1]);});
  root.querySelectorAll('[data-picture]').forEach(c=>{const p=states.market.paintings[+c.dataset.picture],ctx=c.getContext('2d');p.board.forEach((v,i)=>{ctx.fillStyle=v===null?'#b0bcb8':palette[v];ctx.fillRect(i%8,Math.floor(i/8),1,1);});});
  root.querySelectorAll('[data-robot]').forEach(c=>{const x=c.getContext('2d');x.fillStyle='#25363f';x.fillRect(4,14,3,3);x.fillRect(10,14,3,3);x.fillStyle='#66bbaa';x.fillRect(3,7,10,7);x.fillStyle='#c9e9de';x.fillRect(2,2,12,6);x.fillStyle='#263e42';x.fillRect(4,3,3,3);x.fillRect(9,3,3,3);x.fillStyle='#edc75f';x.fillRect(7,0,2,2);x.fillRect(6,10,4,2);});
  root.querySelectorAll('[data-building]').forEach(c=>{const i=+c.dataset.building,x=c.getContext('2d');x.fillStyle='#15252a';x.fillRect(0,0,48,32);x.fillStyle='#9ab8b4';x.fillRect(5,3,1,1);x.fillRect(37,5,1,1);x.fillStyle='#e7d99d';x.fillRect(40,2,4,4);x.fillStyle='#37494a';x.fillRect(0,28,48,4);x.fillStyle=['#90aba6','#9baca1','#91a8b4'][i];x.fillRect(8,13-i*2,32,16+i*2);x.fillStyle='#456360';x.fillRect(6,10-i*2,36,4);x.fillStyle='#e8cf7b';for(let y=0;y<2;y++)for(let a=0;a<4;a++)x.fillRect(11+a*7,16-i*2+y*6,3,3);x.fillStyle='#203b3a';x.fillRect(21,23,6,6);x.fillStyle='#579483';x.fillRect(2,20,4,9);});
  requestAnimationFrame(()=>{const grid=$('.e-pixels'),codes=$('.e-code-rows');if(grid&&codes)codes.style.height=grid.getBoundingClientRect().height+'px';});
 }
 root.addEventListener('click',e=>{if(playing)return;const tab=e.target.closest('[data-game]');if(tab){game=tab.dataset.game;render();persist();return;}const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const t=b.dataset.act;if(t==='retry'||t==='new'){states[game]=E.create(game,states[game].seed+(t==='new'?1:0));render();persist();return;}const type=({painting:'select',station:'select'}[t]||t);doMove({type,index:Number(b.dataset.index),color:Number(b.dataset.color),op:b.dataset.op});});
 function markRow(e){const c=e.target.closest('.e-pixel');if(!c)return;root.querySelectorAll('[data-code-row]').forEach(r=>r.classList.toggle('active',r.dataset.codeRow===c.dataset.row));}
 root.addEventListener('pointerover',markRow);root.addEventListener('focusin',markRow);window.addEventListener('resize',paint);
 window.addEventListener('openai:set_globals',e=>{const v=e.detail?.globals?.widgetState;if(v?.privateContent?.revision===2&&(v.privateContent.serial??0)>serial){restore(v);render();}});
 render();
 if(globalThis.Tweak){const style={compact:false};const tweak=new Tweak({container:$('.e-app'),onChange:()=>{$('.e-board').style.padding=style.compact?'10px':'16px';paint();}});tweak.addToggle(style,'compact',{label:'게임판 여백 줄이기'});}
})();
</script>
</div>
