<div class="q-app" aria-label="빠른 직접 조작 게임">
 <header class="q-top"><span class="q-brand">EDU PLAY</span><span class="q-state" id="qp-state">준비</span></header>
 <nav class="q-tabs" role="tablist" aria-label="게임 선택"><button type="button" id="qp-tab-outlier" role="tab" aria-controls="qp-panel" data-game="outlier">튀는 값 찾기</button><button type="button" id="qp-tab-cargo" role="tab" aria-controls="qp-panel" data-game="cargo">상자 출고</button></nav>
 <section id="qp-panel" role="tabpanel">
  <div class="q-heading"><div><h1 id="qp-title"></h1><p id="qp-goal"></p></div><button type="button" class="q-icon" data-act="reset" aria-label="다시 시작" data-tooltip="다시 시작"><i data-lucide="rotate-ccw" aria-hidden="true"></i></button></div>
  <div class="q-hud"><div><small>점수</small><b id="qp-score">0</b></div><div><small>남은 시간</small><b id="qp-time">0:45</b></div><div><small>내 최고</small><b id="qp-best" class="q-best">-</b></div></div>
  <div class="q-time-track" role="progressbar" aria-label="남은 시간" aria-valuemin="0" aria-valuemax="45"><span id="qp-time-fill"></span></div>
  <div class="q-rules" id="qp-rules"></div>
  <div class="q-field" id="qp-field"></div>
  <div class="q-ledger" id="qp-ledger"></div>
  <div class="q-feedback" id="qp-feedback" role="status" aria-live="polite"></div>
  <div id="qp-result"></div>
 </section>
</div>
<script>
/* QUICK_ENGINE_START */
(function(root,factory){
  const api=factory();
  if(typeof module==='object'&&module.exports)module.exports=api;else root.EduQuickPlay=api;
})(typeof globalThis==='object'?globalThis:this,function(){
  'use strict';
  const DURATION=45000;
  const clone=v=>JSON.parse(JSON.stringify(v));
  function next(s){let x=s.rng||1;x^=x<<13;x^=x>>>17;x^=x<<5;s.rng=x>>>0;return s.rng/4294967296;}
  function shuffle(s,a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(next(s)*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
  const fields=[
    ['도서관 온도','°C',24,8,65],['세면대 온수','°C',42,14,78],
    ['버스 대기','분',18,0,48],['사진 파일 크기','KB',120,20,380],
    ['줄넘기 연습','회',80,12,230],['하루 대출 도서','권',16,0,44]
  ];
  function lane(s,index,first=false){
    const n=first?index:Math.floor(next(s)*fields.length),[name,unit,base,low,high]=fields[n];
    const peers=shuffle(s,[-2,-1,1,2]).map(v=>base+v);
    const small=first?index===1:next(s)<.5;
    const unusual=small?low:high;
    const values=first?(index===0?[24,23,65,25,22]:[42,43,41,14,44]):shuffle(s,peers.concat(unusual));
    return{id:++s.nextId,name,unit,values,target:values.indexOf(unusual),peers:values.filter(v=>v!==unusual),wrong:[],readyAt:0,selected:-1};
  }
  function token(s,type){return{id:++s.nextId,type:type||['A','B','C'][Math.floor(next(s)*3)]};}
  function exposed(s,side){return side==='stack'?s.stack[s.stack.length-1]:s.queue[0];}
  function canTransfer(s,side){return Boolean(exposed(s,side))&&(side==='stack'?s.queue.length:s.stack.length)<4;}
  function transfer(s,side){const t=side==='stack'?s.stack.pop():s.queue.shift();if(side==='stack')s.queue.push(t);else s.stack.push(t);return t;}
  function order(s,first=false){
    if(first){s.order=['B','A','C'];s.orderAt=0;return;}
    const test={stack:clone(s.stack),queue:clone(s.queue)},wanted=[];
    // Generate each order from a legal sequence, including at least one immediate shipment.
    for(let i=0;i<3;i++){
      if(i>0)for(let j=0,n=Math.floor(next(s)*4);j<n;j++){
        const side=next(s)<.5?'stack':'queue';if(canTransfer(test,side))transfer(test,side);
      }
      let side=next(s)<.5?'stack':'queue';if(!exposed(test,side))side=side==='stack'?'queue':'stack';
      wanted.push(exposed(test,side).type);if(side==='stack')test.stack.pop();else test.queue.shift();
    }
    s.order=wanted;s.orderAt=0;
  }
  function event(s,kind,delta,reason,extra={}){s.event={id:++s.eventId,kind,delta,reason,...extra};}
  function start(s,now){if(s.phase==='ready'){s.phase='running';s.deadline=now+DURATION;}}
  function advance(s,now){
    if(s.phase==='running'&&now>=s.deadline){s.phase='done';return;}
    if(s.game==='outlier'&&s.phase!=='done')s.lanes.forEach((p,i)=>{if(p.readyAt&&now>=p.readyAt)s.lanes[i]=lane(s,i);});
  }
  function create(game,seed=31){
    if(!['outlier','cargo'].includes(game))throw Error('Unknown game');
    const s={game,seed,rng:seed>>>0||1,phase:'ready',deadline:0,duration:DURATION,good:0,bad:0,nextId:0,eventId:0,event:null};
    for(let i=0;i<8;i++)next(s);
    if(game==='outlier'){s.lanes=[lane(s,0,true),lane(s,1,true)];s.review=[];}
    else{s.stack=['A','B','C'].map(t=>token(s,t));s.queue=['B','C','A'].map(t=>token(s,t));s.delivered=0;s.ordersDone=0;order(s,true);}
    return s;
  }
  function remaining(s,now){return s.phase==='ready'?DURATION:s.phase==='done'?0:Math.max(0,s.deadline-now);}
  function tick(state,now){
    const needs=state.phase==='running'&&now>=state.deadline||state.game==='outlier'&&state.phase!=='done'&&state.lanes.some(p=>p.readyAt&&now>=p.readyAt);
    if(!needs)return state;const s=clone(state);advance(s,now);return s;
  }
  function step(state,a,now){
    let s=clone(state);advance(s,now);if(s.phase==='done')return s;
    if(s.game==='cargo'&&!['stack','queue'].includes(a.side))return s;
    if(s.game==='outlier'&&a.type==='pick'){
      const p=s.lanes[a.lane];
      if(!p||p.id!==a.id||p.readyAt||!Number.isInteger(a.index)||a.index<0||a.index>=p.values.length||p.wrong.includes(a.index))return s;
      start(s,now);const v=p.values[a.index],range=`${Math.min(...p.peers)}~${Math.max(...p.peers)}`;
      if(a.index===p.target){s.good++;p.selected=a.index;p.readyAt=now+280;s.review.unshift({name:p.name,value:v});s.review=s.review.slice(0,4);event(s,'good',10,`${v}: 다른 네 값 ${range}에서 멀리 떨어짐`,{lane:a.lane,index:a.index,value:v});}
      else{s.bad++;p.wrong.push(a.index);event(s,'bad',-5,`${v}: 다른 값들과 비슷한 크기`,{lane:a.lane,index:a.index,value:v});}
    }else if(s.game==='cargo'&&a.type==='ship'){
      const t=exposed(s,a.side);if(!t||t.id!==a.id)return s;start(s,now);
      const expected=s.order[s.orderAt];
      if(t.type!==expected){s.bad++;event(s,'bad',-5,`지금은 ${expected} 차례 · ${t.type}은 그대로`,{side:a.side,value:t.type});}
      else{
        if(a.side==='stack')s.stack.pop();else s.queue.shift();s.good++;s.delivered++;s.orderAt++;
        event(s,'good',10,`${t.type} 출고 완료`,{side:a.side,value:t.type});
        if(s.orderAt===3){s.ordersDone++;for(let i=0;i<3;i++){let side=next(s)<.5?'stack':'queue';if(s[side].length>=4)side=side==='stack'?'queue':'stack';s[side].push(token(s));}order(s);}
      }
    }else if(s.game==='cargo'&&a.type==='transfer'){
      const t=exposed(s,a.side);if(!t||t.id!==a.id||!canTransfer(s,a.side))return s;start(s,now);transfer(s,a.side);
      event(s,'move',0,`${t.type}: ${a.side==='stack'?'쌓인 상자 위 → 줄 맨 뒤':'줄 맨 앞 → 쌓인 상자 위'}`,{side:a.side,value:t.type});
    }
    return s;
  }
  function info(s){return{score:s.good*10-s.bad*5,good:s.good,bad:s.bad,formula:`${s.good} × 10 - ${s.bad} × 5 = ${s.good*10-s.bad*5}`};}
  return{create,step,tick,remaining,info,exposed,canTransfer,DURATION};
});

/* QUICK_ENGINE_END */
</script>
<script>
(()=>{
 'use strict';
 const root=document.getElementById('edu-quick-play'),$=s=>root.querySelector(s),E=globalThis.EduQuickPlay;
 const icon=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;
 const cargo=(t,active=false,side='')=>t?`<${active?'button type="button"':'span'} class="q-cargo" data-type="${t.type}" ${active?`data-act="ship" data-side="${side}" data-id="${t.id}" aria-label="${t.type} 출고"`:''}>${t.type}</${active?'button':'span'}>`:'';
 const titles={outlier:['튀는 값 찾기','같은 줄에서 혼자 떨어진 숫자를 누르세요'],cargo:['상자 출고','다음 순서와 같은 상자를 눌러 출고하세요']};
 let game='outlier',states={outlier:E.create('outlier',31),cargo:E.create('cargo',31)},best={},serial=0;
 function restore(v){const p=v?.privateContent;if(p?.revision!==3||!titles[p.game])return;game=p.game;for(const k of Object.keys(states))if(p.states?.[k]?.game===k)states[k]=p.states[k];best=p.best||{};serial=p.serial||0;}
 restore(window.openai?.widgetState);
 const save=()=>window.openai?.setWidgetState?.({modelContent:{game,score:E.info(states[game]).score,phase:states[game].phase},privateContent:{revision:3,serial:++serial,game,states,best}})?.catch(()=>{});
 function remember(g){const s=states[g];if(s.phase==='done')best[g]=Math.max(best[g]??-Infinity,E.info(s).score);}
 function outliers(s){
  return `<div class="q-lanes">${s.lanes.map((p,l)=>{const top=Math.ceil(Math.max(...p.values)/10)*10;return `<section class="q-lane"><div class="q-lane-head"><h3>${p.name}</h3><span class="q-small">${p.unit}</span></div><div class="q-values" aria-label="${p.name} 측정값">${p.values.map((v,i)=>{const height=Math.max(5,v/top*112),good=p.selected===i,bad=p.wrong.includes(i);return `<button type="button" class="q-value ${good?'good':''} ${bad?'bad':''}" data-act="pick" data-lane="${l}" data-index="${i}" data-id="${p.id}" ${s.phase==='done'||p.readyAt||bad?'disabled':''} aria-label="${p.name} ${v}${p.unit} 검토"><span class="q-mark">${good?'+10':bad?'-5':''}</span><b class="q-number">${v}</b><span class="q-bar" style="--height:${height}px;height:${height}px"></span></button>`;}).join('')}</div></section>`;}).join('')}</div><div class="q-review">${icon('inbox')}<span class="q-small">검토함</span>${s.review.length?s.review.map(p=>`<span class="q-review-item"><b>${p.value}</b>${p.name}</span>`).join(''):'<span class="q-small">아직 비어 있음</span>'}</div>`;
 }
 function boxes(s){
  const top=E.exposed(s,'stack'),front=E.exposed(s,'queue'),off=s.phase==='done';
  return `<div class="q-shipping"><div class="q-truck"><canvas width="32" height="18" id="qp-truck" aria-hidden="true"></canvas><div><span class="q-next-label">다음 상자</span><b style="font-size:23px;font-weight:500" id="qp-destination">${s.order[s.orderAt]}</b></div></div><div class="q-order" aria-label="출고 순서">${s.order.map((t,i)=>`<span class="${i<s.orderAt?'q-done':i===s.orderAt?'q-now':''}"><small>${i<s.orderAt?'완료':i===s.orderAt?'지금':'다음'}</small><span class="q-cargo" data-type="${t}">${t}</span></span>`).join('')}</div></div><div class="q-storage"><section class="q-store"><h3>쌓인 상자</h3><p>스택 · 맨 위부터</p><div class="q-stack">${s.stack.map((t,i)=>cargo(t,i===s.stack.length-1&&!off,'stack')).join('')||'<span class="q-small">비어 있음</span>'}</div><div class="q-front">${icon('arrow-up')}위 상자 출고</div></section><div class="q-transfer"><button type="button" data-act="transfer" data-side="stack" data-id="${top?.id||0}" ${off||!E.canTransfer(s,'stack')?'disabled':''} aria-label="${top?.type||''}를 줄 맨 뒤로 옮기기"><span class="q-row">${cargo(top)}${icon('arrow-right')}</span><small>뒤로 · 0점</small></button><button type="button" data-act="transfer" data-side="queue" data-id="${front?.id||0}" ${off||!E.canTransfer(s,'queue')?'disabled':''} aria-label="${front?.type||''}를 쌓인 상자 위로 옮기기"><span class="q-row">${icon('arrow-left')}${cargo(front)}</span><small>위로 · 0점</small></button></div><section class="q-store"><h3>줄 선 상자</h3><p>큐 · 맨 앞부터</p><div class="q-queue">${s.queue.map((t,i)=>cargo(t,i===0&&!off,'queue')).join('')||'<span class="q-small">비어 있음</span>'}</div><div class="q-front">${icon('arrow-left')}앞 상자 출고</div></section></div>`;
 }
 function updateClock(){const s=states[game],ms=E.remaining(s,Date.now()),secs=Math.ceil(ms/1000);$('#qp-time').textContent='0:'+String(secs).padStart(2,'0');$('#qp-time-fill').style.width=ms/E.DURATION*100+'%';$('.q-time-track').setAttribute('aria-valuenow',String(secs));$('#qp-state').textContent={ready:'준비',running:'진행 중',done:'종료'}[s.phase];}
 function render(){
  const s=states[game],f=E.info(s),isOut=game==='outlier';$('#qp-title').textContent=titles[game][0];$('#qp-goal').textContent=titles[game][1];$('#qp-panel').setAttribute('aria-labelledby','qp-tab-'+game);root.querySelectorAll('[data-game]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.game===game)));
  $('#qp-score').textContent=f.score;$('#qp-best').textContent=best[game]??'-';$('#qp-rules').innerHTML=`<span class="q-positive">${icon('check')}<b>${isOut?'잘 찾으면':'맞게 출고'} +10</b></span><span class="q-negative">${icon('x')}<b>${isOut?'잘못 누르면':'틀린 출고'} -5</b></span>${!isOut?'<span class="q-neutral">옮기기 0</span>':''}`;
  $('#qp-field').innerHTML=isOut?outliers(s):boxes(s);
  $('#qp-ledger').innerHTML=`<div><span>${isOut?'찾음':'출고'} ${s.good}회</span><b class="q-positive">+${s.good*10}</b></div><div><span>실수 ${s.bad}회</span><b class="q-negative">-${s.bad*5}</b></div><div><span>합계</span><b>${f.score}점</b></div>`;
  const ev=s.event;$('#qp-feedback').innerHTML=ev?`<span class="q-delta ${ev.delta>0?'q-positive':ev.delta<0?'q-negative':'q-neutral'}">${ev.delta>0?'+':''}${ev.delta}</span><span>${ev.reason}</span>`:`<span class="q-small">${isOut?'높은 값도 낮은 값도 찾기 · 검토는 삭제가 아닙니다':'상자는 테두리가 있는 것부터 · 화살표로 옮기기'}</span>`;
  $('#qp-result').innerHTML=s.phase==='done'?`<section class="q-result"><div><h2>45초 끝</h2><p>${s.good} × 10 - ${s.bad} × 5 = ${f.score}점</p></div><b>${f.score}점</b><button type="button" class="q-primary" data-act="reset">${icon('rotate-ccw')}다시 도전</button></section>`:'';
  paintTruck();updateClock();root.querySelectorAll('button').forEach(b=>b.classList.add('cursor-interaction'));if(window.lucide)window.lucide.createIcons();
 }
 function paintTruck(){const c=$('#qp-truck');if(!c)return;const x=c.getContext('2d');x.fillStyle='#426d69';x.fillRect(1,2,19,11);x.fillStyle='#76bcb0';x.fillRect(3,4,15,7);x.fillStyle='#f0c55d';x.fillRect(21,5,7,8);x.fillRect(28,9,3,4);x.fillStyle='#dceeee';x.fillRect(23,6,4,3);x.fillStyle='#253b42';x.fillRect(5,12,5,5);x.fillRect(23,12,5,5);x.fillStyle='#a9c0bf';x.fillRect(6,14,3,1);x.fillRect(24,14,3,1);}
 function feedback(before,after,origin,destination){
  const ev=after.event;if(!ev||ev.id===before.event?.id)return;
  const bounds=root.getBoundingClientRect(),reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(origin&&ev.delta){const el=document.createElement('span');el.className='q-pop '+(ev.delta>0?'q-positive':'q-negative');el.textContent=ev.delta>0?'+'+ev.delta:String(ev.delta);el.style.left=Math.max(2,Math.min(bounds.width-68,origin.left-bounds.left+origin.width/2-25))+'px';el.style.top=Math.max(0,origin.top-bounds.top-15)+'px';root.append(el);if(!reduced)el.animate([{transform:'translateY(0)',opacity:1},{transform:'translateY(-22px)',opacity:0}],{duration:650,easing:'ease-out',fill:'forwards'});setTimeout(()=>el.remove(),700);}
  if(origin&&destination&&after.game==='cargo'&&ev.kind==='good'&&!reduced){const el=document.createElement('span');el.className='q-cargo q-flying';el.dataset.type=ev.value;el.textContent=ev.value;el.style.left=origin.left-bounds.left+'px';el.style.top=origin.top-bounds.top+'px';root.append(el);el.animate([{transform:'translate(0,0)',opacity:1},{transform:`translate(${destination.left-origin.left}px,${destination.top-origin.top}px)`,opacity:0}],{duration:230,easing:'ease-in',fill:'forwards'});setTimeout(()=>el.remove(),260);}
 }
 root.addEventListener('click',e=>{
  const tab=e.target.closest('[data-game]');if(tab){game=tab.dataset.game;states[game]=E.tick(states[game],Date.now());remember(game);render();save();return;}
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  if(b.dataset.act==='reset'){states[game]=E.create(game,states[game].seed+1);render();save();return;}
  const before=states[game],origin=b.getBoundingClientRect(),destination=$('#qp-destination')?.getBoundingClientRect();
  const after=E.step(before,{type:b.dataset.act,side:b.dataset.side,id:Number(b.dataset.id),lane:Number(b.dataset.lane),index:Number(b.dataset.index)},Date.now());states[game]=after;remember(game);render();feedback(before,after,origin,destination);save();
 });
 root.addEventListener('keydown',e=>{if(e.repeat&&['Enter',' '].includes(e.key))e.preventDefault();});
 const heartbeat=setInterval(()=>{let changed=false;for(const g of Object.keys(states)){const n=E.tick(states[g],Date.now());if(n!==states[g]){states[g]=n;remember(g);changed=true;}}if(changed){render();save();}else updateClock();},80);
 window.addEventListener('pagehide',()=>clearInterval(heartbeat),{once:true});
 window.addEventListener('openai:set_globals',e=>{const v=e.detail?.globals?.widgetState;if(v?.privateContent?.revision===3&&(v.privateContent.serial??0)>serial){restore(v);render();}});
 for(const g of Object.keys(states)){states[g]=E.tick(states[g],Date.now());remember(g);}render();
 if(globalThis.Tweak){const prefs={roomy:false};const tweak=new Tweak({container:$('.q-app'),onChange:()=>{$('.q-field').style.padding=prefs.roomy?'20px':'12px';}});tweak.addToggle(prefs,'roomy',{label:'게임판 여백'});}
})();
</script>
