 function plot(){const canvas=$('#ol-plot'),w=Math.round(canvas.getBoundingClientRect().width),dpr=window.devicePixelRatio||1,c=colours();width=w;canvas.width=w*dpr;canvas.height=400*dpr;const x=canvas.getContext('2d');x.scale(dpr,dpr);const sorted=[...state.reference].sort((a,b)=>a-b),median=(sorted[3]+sorted[4])/2,bounds=Core.fences(state.reference),rangeLeft=position(Math.max(0,bounds.lo),0).x,rangeRight=position(Math.min(100,bounds.hi),0).x;x.fillStyle=c.range;x.fillRect(rangeLeft,42,rangeRight-rangeLeft,308);x.strokeStyle=c.line;x.lineWidth=1;x.setLineDash([3,4]);x.beginPath();x.moveTo(position(median,0).x,42);x.lineTo(position(median,0).x,350);x.stroke();x.setLineDash([]);x.font='400 11px "Malgun Gothic",sans-serif';x.fillStyle=c.muted;x.textAlign='left';x.fillText('비교',10,24);x.fillText('새 관측',10,72);x.textAlign='center';for(let n=0;n<=100;n+=20){const px=position(n,0).x;x.strokeStyle=c.grid;x.lineWidth=1;x.beginPath();x.moveTo(px,42);x.lineTo(px,350);x.stroke();x.fillStyle=c.muted;x.fillText(n,px,375);}for(let i=0;i<6;i++){x.strokeStyle=c.grid;x.beginPath();x.moveTo(28,position(0,i).y);x.lineTo(w-28,position(0,i).y);x.stroke();const r=[...state.records].reverse()[i];x.strokeStyle=c.line;x.beginPath();x.moveTo(position(median,0).x,position(0,i).y);x.lineTo(position(r.value,0).x,position(0,i).y);x.stroke();}const repeated=new Map();for(const n of state.reference){const count=repeated.get(n)||0;repeated.set(n,count+1);const px=position(n,0).x,y=23-count*7;x.beginPath();x.arc(px,y,3.5,0,Math.PI*2);x.fillStyle=c.muted;x.fill();}x.textAlign='right';x.fillStyle=c.muted;x.fillText('측정값',w-8,395);}
 function pointLayout(){const points=$('#ol-points'),existing=new Map([...points.querySelectorAll('.p-point')].map(b=>[Number(b.dataset.id),b]));const records=[...state.records].reverse();records.forEach((r,slot)=>{let b=existing.get(r.id);if(!b){b=document.createElement('button');b.type='button';b.className='p-point';b.dataset.id=r.id;points.appendChild(b);}existing.delete(r.id);const p=position(r.value,slot);b.style.left=`${p.x}px`;b.style.top=`${p.y}px`;b.dataset.slot=slot;b.dataset.value=r.value;b.textContent=r.claimed?`${r.value} ✓`:r.value;b.classList.toggle('is-reviewed',r.claimed);b.classList.toggle('is-wrong',!r.claimed&&r.attemptedEpoch===state.epoch);b.disabled=r.claimed||r.attemptedEpoch===state.epoch||state.mode==='paused'||state.mode==='ended';b.setAttribute('aria-label',`관측 ${r.value}${r.claimed?', 검토 완료':''}`);points.appendChild(b);});for(const b of existing.values())b.remove();}
 function floating(){const e=state.event,key=e?`${e.id}/${e.at}/${e.kind}`:'';if(!key||key===lastFloat)return;lastFloat=key;const r=[...state.records].reverse().findIndex(v=>v.id===e.id);if(r<0||state.elapsed-e.at>700)return;const p=position(e.value,r),f=document.createElement('span');f.className=`p-float${e.kind==='catch'?'':' is-bad'}`;f.textContent=e.kind==='catch'?'+1':'−1';f.style.left=`${p.x}px`;f.style.top=`${p.y-29}px`;$('#ol-arena').appendChild(f);setTimeout(()=>f.remove(),700);}
 function render(){if(state.version!==lastRender){lastRender=state.version;$('#ol-score').textContent=state.score;$('#ol-reference').textContent=state.reference.join(' · ');const f=Core.fences(state.reference);$('#ol-band').textContent=`비교 구간 ${f.lo}–${f.hi}`;$('#ol-flow').textContent=`흐름 ${state.epoch+1}`;$('#ol-feedback').textContent=state.message;$('#ol-feedback').dataset.tone=state.tone;if(state.reason)$('#ol-reason').textContent=state.reason;plot();pointLayout();floating();}
  if(state.lives!==lastLife){lastLife=state.lives;$('#ol-lives').innerHTML=Array.from({length:3},(_,i)=>`<i data-lucide="heart" aria-hidden="true" class="${i>=state.lives?'is-empty':''}"></i>`).join('');$('#ol-lives').setAttribute('aria-label',`남은 기회 ${state.lives}`);iconise();}
  if(state.mode!==lastMode){lastMode=state.mode;const isRunning=state.mode==='running',name=isRunning?'일시정지':state.mode==='ready'?'시작':state.mode==='ended'?'결과 보기':'계속하기';$('#ol-mode').innerHTML=`<i data-lucide="${isRunning?'pause':state.mode==='ended'?'trophy':'play'}" aria-hidden="true"></i>`;$('#ol-mode').setAttribute('aria-label',name);$('#ol-mode').dataset.tooltip=name;$('#ol-again').innerHTML=state.mode==='paused'?'<i data-lucide="play" aria-hidden="true"></i>계속하기':'<i data-lucide="rotate-ccw" aria-hidden="true"></i>다시 도전';iconise();}
  const left=Math.max(0,Math.ceil((Core.DURATION-state.elapsed)/1000));$('#ol-time').textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`;const next=Math.max(0,state.nextPulse-state.elapsed);$('#ol-next').textContent=state.mode==='ready'?'새 관측 대기':state.mode==='paused'?'일시정지':state.mode==='ended'?'이번 흐름 종료':`새 관측 ${(next/1000).toFixed(1)}초`;$('#ol-progress').style.width=state.mode==='running'?`${100*(1-next/Core.PERIOD)}%`:'0%';
  const ended=state.mode==='ended';$('#ol-overlay').hidden=!(ended&&!viewBoard||state.mode==='paused');$('#ol-result-title').textContent=state.mode==='paused'?'일시정지':state.finishReason==='time'?'시간 종료':'기회 소진';$('#ol-result-score').textContent=state.mode==='paused'?'잠깐 쉬기':`${state.score}`;$('#ol-best').textContent=state.mode==='paused'?'관측 흐름이 멈췄습니다':`내 최고 기록 ${state.best}`;$('#ol-result-line').textContent=state.mode==='paused'?'':`검토 ${state.caught} · 오경보 ${state.falseAlarms} · 놓침 ${state.missed}`;$('#ol-inspect').hidden=state.mode==='paused';
 }
 function save(){serial++;applied=true;window.openai?.setWidgetState?.({modelContent:{prototype:'outlier-live-board',score:state.score,caught:state.caught,falseAlarms:state.falseAlarms,missed:state.missed,mode:state.mode,epoch:state.epoch,best:state.best},privateContent:{schema:1,state,serial}})?.catch(()=>{});}
 function changed(before){if(state.version!==before){render();save();}}
 $('#ol-points').addEventListener('click',e=>{const b=e.target.closest('.p-point');if(!b)return;const v=state.version;Core.pick(state,Number(b.dataset.id),Date.now());changed(v);});$('#ol-mode').addEventListener('click',()=>{if(state.mode==='ended'){viewBoard=false;render();return;}const v=state.version;if(state.mode==='running')Core.pause(state,Date.now());else Core.start(state,Date.now());changed(v);});
 $('#ol-again').addEventListener('click',()=>{if(state.mode==='paused')Core.start(state,Date.now());else{state=Core.fresh(state.seed+731,state.best);lastFloat='';root.querySelectorAll('.p-float').forEach(n=>n.remove());}viewBoard=false;lastRender=-1;render();iconise();save();});$('#ol-inspect').addEventListener('click',()=>{viewBoard=true;render();});
 document.addEventListener('visibilitychange',()=>{if(document.hidden&&state.mode==='running'){const v=state.version;Core.pause(state,Date.now());changed(v);}});
 let resizePending=false;function resized(){if(resizePending)return;resizePending=true;requestAnimationFrame(()=>{resizePending=false;plot();pointLayout();});}new ResizeObserver(resized).observe($('#ol-arena'));new MutationObserver(resized).observe(document.documentElement,{attributes:true,attributeFilter:['class','style','data-theme']});matchMedia('(prefers-color-scheme:dark)').addEventListener('change',resized);window.addEventListener('openai:set_globals',e=>{if(restore(e.detail?.globals?.widgetState))render();else resized();});
 function frame(){const v=state.version;Core.tick(state,Date.now());render();if(v!==state.version)save();requestAnimationFrame(frame);}render();iconise();requestAnimationFrame(frame);
})();
</script>
