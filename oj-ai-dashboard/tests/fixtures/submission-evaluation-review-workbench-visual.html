        if (value.includes('/submission-evaluations?')) {
          const items = window.__evaluationStarted ? [evaluation, second, candidateEvaluation] : [evaluation, second];
          return jsonResponse(envelope({ items }, { next_cursor: '', has_more: false, limit: 40 }));
        }
        if (value.includes('/submission-evaluation-candidates?')) {
          const items = window.__evaluationStarted || window.__manualRequests.length ? [] : [candidate];
          return jsonResponse(envelope({ items }, { next_cursor: '', has_more: false, limit: 40 }));
        }
        if (value.includes(`/submission-evaluation-candidates/${ids.candidateSubmission}?`) && (!options.method || options.method === 'GET')) {
          return jsonResponse(envelope({ submission: candidateSubmission }));
        }
        if (value.includes(`/submission-evaluations/${ids.candidateEvaluation}?`) && (!options.method || options.method === 'GET')) {
          window.__reviewDetailReads += 1;
          return jsonResponse(envelope(candidateEvaluationDetail));
        }
        if (value.includes(`/submission-evaluations/${ids.evaluation}?`) && (!options.method || options.method === 'GET')) {
          window.__reviewDetailReads += 1;
          return jsonResponse(envelope(detail));
        }
        if (value.includes(`/submission-evaluations/${ids.evaluationTwo}?`) && (!options.method || options.method === 'GET')) {
          window.__reviewDetailReads += 1;
          return jsonResponse(envelope({ ...detail, evaluation: second }));
        }
        if (value.includes(`/submissions/${ids.candidateSubmission}/commands/evaluate?`) && options.method === 'POST') {
          window.__evaluationRequests.push({ url: value, headers: options.headers, body: JSON.parse(options.body) });
          window.__evaluationStarted = true;
          return jsonResponse(envelope({
            evaluation: {
              id: ids.candidateEvaluation,
              state: 'queued',
              submission_id: ids.candidateSubmission,
              submission_revision_id: ids.candidateRevision,
            },
            run: { id: ids.run, run_no: 1, state: 'queued' },
          }), 202);
        }
        if (value.includes(`/submissions/${ids.candidateSubmission}/commands/start-manual-assessment?`) && options.method === 'POST') {
          window.__manualRequests.push({ url: value, headers: options.headers, body: JSON.parse(options.body) });
          Object.assign(evaluation, { learner: candidate.learner, submission: candidateEvaluation.submission, state: 'review_required', latest_run: { ...evaluation.latest_run, operation: 'manual_prepare' } });
          Object.assign(detail.source.submission_revision, { id: ids.candidateRevision, content_hash: hash('7') });
          Object.assign(detail.selected_result, { provider_status: 'not_requested', candidate_score: null, abstained: true, safety_flagged: false, overall_confidence: '0.0000', summary: '교사 직접 채점' });
          detail.selected_result.items.forEach(item => Object.assign(item, { candidate_points: null, decision: 'abstain', rationale: null, abstain_reason: 'not_requested', confidence: '0.0000', flags: [], evidence: [], levels: [
            { label: '관찰한 사실과 판단 근거를 구체적으로 연결하여 설명함.', points: item.maximum_points },
            { label: '관찰한 사실을 부분적으로 설명하였으나 판단 근거가 부족함.', points: '1.0000' },
            { label: '평가 기준에 해당하는 응답이 없음.', points: '0.0000' },
          ] }));
          return jsonResponse(envelope({ evaluation: { id: ids.evaluation, state: 'review_required' }, run: { id: ids.run, state: 'succeeded' } }), 201);
        }
        if (value.includes('/commands/review?') && options.method === 'POST') {
          window.__reviewRequests.push({ url: value, headers: options.headers, body: JSON.parse(options.body) });
          if (window.__reviewConflictOnce) {
            window.__reviewConflictOnce = false;
            return jsonResponse({ code: 'review_source_stale', message: '평가 결과가 변경되었습니다.', data: { status: 409 } }, 409);
          }
          if (window.__reviewPermissionDenied) {
            return jsonResponse({ code: 'submission_evaluation_review_scope_denied', message: '권한이 없습니다.', data: { status: 403 } }, 403);
          }
          if (window.__reviewPersistTransitions) {
            const body = JSON.parse(options.body);
            const withdrawn = body.payload.decision === 'withdrawn';
            const reviewNo = detail.reviews.length + 1;
            const reviewId = '01K5A0000000000000000000' + String(reviewNo).padStart(2, '0');
            const items = body.payload.decision === 'accepted'
              ? detail.selected_result.items.map(item => ({ ...item, official_points: item.candidate_points }))
              : body.payload.item_decisions;
            detail.reviews.forEach(item => { item.is_official = false; });
            detail.reviews.push({ id: reviewId, result_id: ids.result, review_no: reviewNo,
              decision: body.payload.decision, official_score: withdrawn ? null : String(items.reduce((sum, item) => sum + Number(item.official_points), 0)),
              score_decisions: withdrawn ? null : { value: { items } }, is_official: !withdrawn,
              reason: body.payload.reason, created_at_utc: '2026-10-23 10:00:00' });
            detail.review_precondition.expected_review_no = reviewNo;
            detail.review_precondition.expected_official_review_id = withdrawn ? null : reviewId;
            detail.review_precondition.expected_official_review_hash = withdrawn ? null : hash('8');
            evaluation.review = { official_id: withdrawn ? null : reviewId, official_scope: withdrawn ? 'none' : 'this_evaluation' };
            evaluation.state = withdrawn ? 'review_required' : 'reviewed';
          } else evaluation.state = 'reviewed';
          return jsonResponse(envelope({ evaluation: { id: ids.evaluation }, result: { id: ids.result, hash: hash('9') }, review: { id: '01K5A00000000000000000000H', hash: hash('8'), review_no: 1, decision: 'adjusted', official_score: '6.5000', item_decisions: [] }, official_review: { id: '01K5A00000000000000000000H', hash: hash('8'), advanced: true } }), 201);
        }
        return jsonResponse({ code: 'oj_ai_not_found', message: '대상을 찾을 수 없습니다.', data: { status: 404 } }, 404);
      };
      window.__reviewFixture = detail;
    })();
  </script>
