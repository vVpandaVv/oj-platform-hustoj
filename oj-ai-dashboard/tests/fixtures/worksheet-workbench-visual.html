              student_document: previewEnvelope('oj_ai.student_document', payloads.document),
              response_schema: previewEnvelope('oj_ai.student_response_schema', payloads.responses),

              kind: 'print',
              profile: 'student_blank',
              print_projection: previewEnvelope('oj_ai.worksheet_print', {

                  font_token: 'worksheet_system@1',

            };
        return envelope({
          worksheet_id: worksheetId,
          revision: {
            id: revisionId,
            state: 'draft',
            document_hash: 'a'.repeat(64),
            validation_hash: 'b'.repeat(64),
          },
          preview: {
            kind,
            profile: kind === 'student' ? 'student' : 'student_blank',
            projection_hash: 'c'.repeat(64),

          },
        }, { mutation_count: 0, private_asset_urls: 0 });
      };
      window.fetch = async (url, options = {}) => {
        if (window.__teacherOnly && (options.method || 'GET') !== 'GET' && /evaluations|consent|ai-provider/.test(String(url))) {
          window.__unexpectedAiRequests = (window.__unexpectedAiRequests || 0) + 1;

        }
        if (String(url).endsWith('/assessment-project')) return response({ data: { project: null } });
        await new Promise((resolve) => setTimeout(resolve, 40));
        const path = String(url);
        if (path.includes('/curriculums/01K00000000000000000000300/standards?') && (options.method || 'GET') === 'GET') return response(envelope({ items: achievementStandards }));

        if (path.endsWith('/settings/rubrics') && (options.method || 'GET') === 'GET') return response(envelope({ rubrics: { subjects: [{ subject_type: 'student_submission', active_revision_id: '01K00000000000000000000201', revisions: [{ revision_id: '01K00000000000000000000201', value: { criteria: [{ criterion_id: '01K00000000000000000000211', label: '내용 정확성', description: '응답 내용이 관찰 사실과 일치하는지 확인합니다.', maximum_points: '3', scope: 'response' }, { criterion_id: '01K00000000000000000000212', label: '설명 근거', description: '주장을 뒷받침하는 구체적인 관찰 근거를 확인합니다.', maximum_points: '2', scope: 'response' }, { criterion_id: '01K00000000000000000000213', label: '전체 완성도', description: '모든 필수 응답을 빠짐없이 작성했는지 확인합니다.', maximum_points: '1', scope: 'submission' }] } }] }] } }));
        if (path.includes('/worksheet-evaluations?') && (options.method || 'GET') === 'GET') {
          window.__lastWorksheetQualityUrl = path;
          if (window.__teacherOnly) return response({ ok: false, message: 'AI 점검 권한이 없습니다.' }, 403);
          return response(envelope({ items: [{
            id: '01HZY3M4N5P6Q7R8S9T0V1W2XD',
            state: 'review_required',
            is_stale: false,
            worksheet: { id: worksheetId, title: teacherDocument.title },
            revision: { id: revisionId, revision_no: 3, state: revisionState, source_hash: 'a'.repeat(64), is_current: true },
            status: { finding_count: 2, needs_attention_count: 2, next_action: 'review' },
          }] }));
        }
        if (path.endsWith(`/worksheets/${worksheetId}`) && (options.method || 'GET') === 'GET') {
          return response(envelope({ worksheet: {
            id: worksheetId,
            title: teacherDocument.title,
            state: rootState,
            current_revision_id: revisionId,
            latest_publication_id: latestPublicationId,
            lock_version: lockVersion,
            updated_at_utc: '2026-08-21T09:00:00Z'
          } }));
        }
        if (path.endsWith(`/worksheet-revisions/${revisionId}`)) {
          return response(envelope({
            worksheet_id: worksheetId,
            revision: { id: revisionId, revision_no: 1, state: revisionState, document_hash: 'a'.repeat(64) },
            teacher_document: teacherDocument,
            questions: [],
            achievement_links: achievementLinks,
            standard_snapshots: achievementSnapshots
          }));
        }
        if (path.includes(`/worksheet-revisions/${revisionId}/preview?projection=student`)) {
          window.__lastPreviewKind = 'student';
          return response(previewResult('student'));
        }
        if (path.includes(`/worksheet-revisions/${revisionId}/preview?projection=print&profile=student_blank`)) {
          window.__lastPreviewKind = 'print';
          return response(previewResult('print'));
        }
        if (path.includes(`/worksheet-revisions/${revisionId}/commands/export-pdf`)) {
          window.__lastWorksheetPdfExportRequest = JSON.parse(options.body || '{}');
          return response(envelope({ export_job: {
            id: pdfJobId,
            state: 'queued',
            source_type: 'worksheet_revision',
            source_id: revisionId,
            source_hash: 'a'.repeat(64),
          } }), 202);
        }
        if (path.includes(`/worksheet-revisions/${revisionId}/commands/export-package`)) {
          window.__lastWorksheetPackageExportRequest = JSON.parse(options.body || '{}');
          return response(envelope({ export_job: {
            id: packageJobId,
            state: 'queued',
            artifact_kind: 'worksheet_package',
            source_type: 'worksheet_revision',
            source_id: revisionId,
            source_hash: 'a'.repeat(64),
          } }), 202);
        }
        if (path.endsWith(`/export-jobs/${pdfJobId}`)) {
          return response(envelope({ export_job: {
            job_id: pdfJobId,
            state: 'ready',
            artifact_kind: 'worksheet_pdf',
            source_type: 'worksheet_revision',
            source_id: revisionId,
            source_hash: 'a'.repeat(64),
            artifact_id: pdfArtifactId,
            expires_at_utc: '2026-08-23 10:00:00',
          } }));
        }
        if (path.endsWith(`/export-jobs/${packageJobId}`)) {
          return response(envelope({ export_job: {
            job_id: packageJobId,
            state: 'ready',
            artifact_kind: 'worksheet_package',
            source_type: 'worksheet_revision',
            source_id: revisionId,
            source_hash: 'a'.repeat(64),
            artifact_id: packageArtifactId,
            expires_at_utc: '2026-08-23 10:00:00',
          } }));
        }
        if (path.endsWith(`/artifacts/${pdfArtifactId}/download`)) {
          window.__lastExportDownloadRequest = { artifact_id: pdfArtifactId, kind: 'worksheet_pdf' };
          return binaryResponse('%PDF-1.7\nvisual fixture\n%%EOF', 'application/pdf', 'worksheet_pdf');
        }
        if (path.endsWith(`/artifacts/${packageArtifactId}/download`)) {
          window.__lastExportDownloadRequest = { artifact_id: packageArtifactId, kind: 'worksheet_package' };
          return binaryResponse('PK visual worksheet package', 'application/vnd.oj.ai-worksheet+zip', 'worksheet_package');
        }
        if (path.includes(`/worksheet-revisions/${revisionId}/commands/validate`)) {
          window.__lastValidationRequest = JSON.parse(options.body || '{}');
          return response(envelope({
            worksheet_id: worksheetId,
            revision: {
              id: revisionId,
              state: revisionState,
              document_hash: 'a'.repeat(64),
              validation_hash: 'b'.repeat(64),
            },
            validation: {
              schema_id: 'oj_ai.worksheet_validation_projection',
              schema_version: '1.0.0',
              status: 'ready',
              release_ready: true,
              projection_hash: 'c'.repeat(64),
              checks: [
                'document_profile', 'canonical_hash', 'validation_receipt', 'asset_readiness',
                'student_projection', 'print_projection', 'renderer_parity', 'private_field_scan'
              ].map((id) => ({ id, status: 'passed' })),
              blockers: [],
              warnings: [],
              statistics: { forbidden_field_count: 0, private_asset_url_count: 0 },
            },
            approval: {
              status: revisionState === 'approved' ? 'approved' : 'ready',
              approval_ready: true,
              decision_hash: approvalDecisionHash,
              evidence_hash: approvalEvidenceHash,
              blockers: [],
              warnings: window.__teacherOnly ? [{ code: window.__approvalWarning || 'worksheet_evaluation_not_run' }] : [],
            },
          }, { mutation_count: 0, validated_at_utc: '2026-08-21 16:00:00' }));
        }
        if (path.includes(`/worksheet-revisions/${revisionId}/commands/approve`)) {
          window.__lastApprovalRequest = JSON.parse(options.body || '{}');
          revisionState = 'approved';
          lockVersion += 1;
          return response(envelope({
            worksheet_id: worksheetId,
            revision: { id: revisionId, revision_no: 2, state: revisionState, document_hash: 'a'.repeat(64) },
            approval: { status: 'ready', decision_hash: approvalDecisionHash, evidence_hash: approvalEvidenceHash },
          }, { mutation_count: 1 }));
        }
        if (path.includes(`/worksheet-revisions/${revisionId}/commands/publish`)) {
          window.__publicationRequestCount = (window.__publicationRequestCount || 0) + 1;
          window.__lastPublicationRequest = JSON.parse(options.body || '{}');
          rootState = 'active';
          latestPublicationId = publicationId;
          lockVersion += 1;
          return response(envelope({
            worksheet_id: worksheetId,
            revision: { id: revisionId, state: revisionState, document_hash: 'a'.repeat(64) },
            publication: { id: publicationId, publication_no: 1, state: 'active' },
            approval_decision_hash: approvalDecisionHash,
          }, { mutation_count: 1 }), 201);
        }
        if (path.includes(`/worksheets/${worksheetId}/commands/archive`)) {
          window.__lastLifecycleRequest = JSON.parse(options.body || '{}');
          rootState = 'archived';
          lockVersion += 1;
          return response(envelope({ worksheet: {
            id: worksheetId, state: rootState, current_revision_id: revisionId,
            latest_publication_id: latestPublicationId, lock_version: lockVersion, archived_at_utc: '2026-08-21 16:10:00',
          }, transition: { operation: 'archive', previous_state: 'active' } }, { mutation_count: 1 }));
        }
        if (path.includes(`/worksheets/${worksheetId}/commands/restore`)) {
          window.__lastRestoreRequest = JSON.parse(options.body || '{}');
          rootState = latestPublicationId ? 'active' : 'draft';
          lockVersion += 1;
          return response(envelope({ worksheet: {
            id: worksheetId, state: rootState, current_revision_id: revisionId,
            latest_publication_id: latestPublicationId, lock_version: lockVersion, archived_at_utc: null,
          }, transition: { operation: 'restore', previous_state: 'archived' } }, { mutation_count: 1 }));
        }
        if (path.includes(`/worksheet-assets/${assetId}/content`)) {
          const canvas = document.createElement('canvas');
          canvas.width = 640;
          canvas.height = 320;
          const context = canvas.getContext('2d');
          context.fillStyle = '#dce9df';
          context.fillRect(0, 0, canvas.width, canvas.height);
          context.fillStyle = '#3b7352';
          context.fillRect(32, 32, 576, 208);
          context.fillStyle = '#ffffff';
          context.font = 'bold 40px sans-serif';
          context.fillText('관찰 사진', 220, 155);
          const png = await new Promise((resolve) => canvas.toBlob(resolve, 'image/png'));
          return new Response(png, { status: 200, headers: { 'Content-Type': 'image/png' } });
        }
        if (path.includes('/commands/stage-asset')) {
          const form = options.body;
          window.__lastStageRequest = {
            command_id: form.get('command_id'),
            expected_state: form.get('expected_state'),
            expected_revision_id: form.get('expected_revision_id'),
            file_name: form.get('file')?.name || '',
            content_type: options.headers?.['Content-Type'] || '',
          };
          return response({
            data: { asset: {
              id: assetId,
              original_name: '현장 사진.png',
              mime_type: 'image/png',
              byte_size: 8,
              sha256: 'a'.repeat(64),
              state: 'quarantined',
              scan_state: 'clean'
            } },
            meta: { correlation_id: 'visual-stage', expires_at_utc: '2026-08-21 12:30:00' },
            links: {},
            actions: ['worksheet.asset.discard']
          }, 201);
        }
        if (path.includes('/commands/import-template')) {
          const form = options.body;
          window.__lastImportRequest = {
            command_id: form.get('command_id'),
            expected_state: form.get('expected_state'),
            expected_revision_id: form.get('expected_revision_id'),
            package_name: form.get('package')?.name || '',
            content_type: options.headers?.['Content-Type'] || '',
          };
          revisionId = importedRevisionId;
          revisionState = 'draft';
          latestPublicationId = null;
          teacherDocument.title = '가져온 생태 활동지';
          teacherDocument.nodes = [
            { type: 'h1', node_id: '01HZY3M4N5P6Q7R8S9T0V1W2XD', children: [{ text: teacherDocument.title }] },
            { type: 'p', node_id: '01HZY3M4N5P6Q7R8S9T0V1W2XE', children: [{ text: '가져온 내용을 확인하세요.' }] },
            {
              type: 'oj_ai_response',
              node_id: '01HZY3M4N5P6Q7R8S9T0V1W2XP',
              response_id: '01HZY3M4N5P6Q7R8S9T0V1W2XQ',
              kind: 'long_text',
              label: '생태 관찰 내용',
              required: true,
              constraints: { min_chars: 20, max_chars: 1200 },
              grading: { rubric_criterion_ids: ['01K00000000000000000000211', '01K00000000000000000000212'], max_points: '5' },
              children: [{ text: '' }]
            },
            { type: 'p', node_id: '01HZY3M4N5P6Q7R8S9T0V1W2XR', children: [{ text: '' }] }
          ];
          teacherDocument.settings.learning_goals = [{
            goal_id: '01HZY3M4N5P6Q7R8S9T0V1W2XS',
            text: '관찰 결과를 근거와 함께 설명할 수 있다.',
            scope: 'response',
            response_id: '01HZY3M4N5P6Q7R8S9T0V1W2XQ',
          }];
          achievementLinks = [{
            scope: 'response', response_id: '01HZY3M4N5P6Q7R8S9T0V1W2XQ',
            standard_public_id: '01K00000000000000000000301', alignment_type: 'primary',
          }];
          return response(envelope({
            worksheet: { id: worksheetId, title: teacherDocument.title, state: rootState, current_revision_id: revisionId },
            revision: { id: revisionId, revision_no: 2, state: revisionState, document_id: teacherDocument.document_id, document_hash: 'a'.repeat(64) },
            import: { package_source_revision_id: '01HZY3M4N5P6Q7R8S9T0V1W2XF', imported_asset_count: 0, reissued_id_count: 6 }
          }, { package_hash: 'b'.repeat(64), saved_at_utc: new Date().toISOString() }));
        }
        if (path.includes('/commands/duplicate')) {
          window.__lastDuplicateRequest = JSON.parse(options.body || '{}');
          return response(envelope({ worksheet: { id: '01HZY3M4N5P6Q7R8S9T0V1W2XG' } }), 201);
        }
        if (path.includes('/commands/save-draft')) {
          const body = JSON.parse(options.body || '{}');
          teacherDocument.title = body.payload.teacher_document.title;
          window.__lastSavedReceipts = body.payload.staged_asset_receipt_ids;
          window.__lastSavedAchievementLinks = JSON.parse(JSON.stringify(body.payload.achievement_links));
          window.__lastSavedTeacherDocument = JSON.parse(JSON.stringify(body.payload.teacher_document));
          teacherDocument.nodes = body.payload.teacher_document.nodes;
          return response(envelope({
            worksheet: { id: worksheetId, title: teacherDocument.title, state: rootState, current_revision_id: revisionId },
            revision: { id: revisionId, revision_no: 1, state: revisionState, document_id: teacherDocument.document_id, document_hash: 'a'.repeat(64) },
            temporary_id_map: {}
          }, { unchanged: true, saved_at_utc: new Date().toISOString() }));
        }
        return response({ code: 'fixture_not_found', message: '요청을 찾을 수 없습니다.', data: { status: 404 } }, 404);
      };

      function response(payload, status = 200) {
        return { ok: status >= 200 && status < 300, status, json: async () => payload };
      }

      async function binaryResponse(value, mimeType, artifactKind) {
        const bytes = new TextEncoder().encode(value);
        const digest = await crypto.subtle.digest('SHA-256', bytes);
        const sha256 = Array.from(new Uint8Array(digest), (byte) => byte.toString(16).padStart(2, '0')).join('');
        return new Response(bytes, {
          status: 200,
          headers: {
            'Content-Type': mimeType,
            'Content-Length': String(bytes.byteLength),
            'Content-Disposition': 'attachment',
            'X-OJ-Artifact-Kind': artifactKind,
            'X-OJ-Content-SHA256': sha256,
          },
        });
      }
    })();
  </script>
