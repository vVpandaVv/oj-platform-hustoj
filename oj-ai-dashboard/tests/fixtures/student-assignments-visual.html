        return { ok: true, status: 202, async json() { return envelope({ export_job: {
          id: submissionPdfJobId, state: 'queued', artifact_kind: 'submission_pdf', source_type: 'submission_revision',
          source_id: submissionDetail.official_revision.id, source_hash: submissionDetail.official_revision.content_hash, submission_id: submissionId,
        } }); } };
      }
      if (value.endsWith(`/export-jobs/${submissionPdfJobId}`) && method === 'GET') {
        return { ok: true, status: 200, async json() { return envelope({ export_job: {
          job_id: submissionPdfJobId, state: 'ready', artifact_kind: 'submission_pdf', source_type: 'submission_revision',
          source_id: submissionDetail.official_revision.id, source_hash: submissionDetail.official_revision.content_hash, artifact_id: submissionPdfArtifactId,
        } }); } };
      }
      if (value.endsWith(`/artifacts/${submissionPdfArtifactId}/download`) && method === 'GET') {
        window.__studentSubmissionPdfDownloads.push({ headers: { ...(options.headers || {}) } });
        return {
          ok: true, status: 200,
          async blob() { return new Blob(['%PDF-1.7 submission fixture'], { type: 'application/pdf' }); },
          async json() { return {}; },
        };
      }
      if (value.endsWith(`/me/submissions/${submissionId}/commands/autosave`) && method === 'POST') {
        const body = JSON.parse(options.body || '{}');
        window.__studentAutosaveRequests.push({ body, headers: { ...(options.headers || {}) } });
        if (window.__studentAutosaveMode === 'offline') throw new TypeError('fixture offline');
        if (window.__studentAutosaveMode === 'delayed') {
          await new Promise((resolve) => { window.__studentAutosaveRelease = resolve; });
          window.__studentAutosaveRelease = null;
          window.__studentAutosaveMode = 'success';
        }
        if (window.__studentAutosaveMode === 'conflict') {
          const serverAnswers = { ...submissionDetail.current_revision?.response?.answers, 'response-short': '서버에서 저장한 답' };
          commitAutosave(body, serverAnswers);
          window.__studentAutosaveMode = 'conflict-returned';
          return { ok: false, status: 409, async json() { return { code: 'submission_revision_conflict', message: '내용이 바뀌었습니다. 새로고침해 주세요.', data: { status: 409, correlation_id: 'g3-conflict' } }; } };
        }
        const result = commitAutosave(body);
        submissionDetail.attachments.forEach((row) => {
          const selected = Object.values(body.payload.answers).some((answer) => Array.isArray(answer) && answer.includes(row.id));
          if (selected) { row.state = 'bound'; row.revision_scope = ['current']; }
          else if (row.state === 'bound') row.revision_scope = [];
        });
        return { ok: true, status: 201, async json() { return envelope(result); } };
      }
      if (value.endsWith(`/me/submissions/${submissionId}/commands/submit`) && method === 'POST') {
        const body = JSON.parse(options.body || '{}');
        window.__studentSubmitRequests.push({ body, headers: { ...(options.headers || {}) } });
        const receipt = { id: '1E040G2081040G2081040G2081', receipt_no: 1, action: 'submit', attempt_no: 1, timeliness: 'on_time', received_at_utc: '2026-08-22 10:40:00' };
        submissionDetail = {
          ...submissionDetail,
          state: 'submitted',
          lock_version: Number(submissionDetail.lock_version || 0) + 1,
          official_revision: submissionDetail.current_revision,
          official_attempt_no: 1,
          receipt,
          submitted_at_utc: receipt.received_at_utc,
          actions: ['submission.export_pdf'],
        };
        detail = {
          ...detail,
          submission: {
            id: submissionId,
            state: 'submitted',
            lock_version: submissionDetail.lock_version,
            current_revision_id: submissionDetail.current_revision?.id || null,
            official_revision_id: submissionDetail.official_revision?.id || null,
            official_attempt_no: 1,
            started_at_utc: submissionDetail.started_at_utc,
            submitted_at_utc: submissionDetail.submitted_at_utc,
          },
          actions: ['assignment.export_pdf'],
        };
        const submission = {
          id: submissionId, assignment_id: assignmentId, state: submissionDetail.state,
          lock_version: submissionDetail.lock_version,
          current_revision_id: submissionDetail.current_revision.id,
          official_revision_id: submissionDetail.official_revision.id,
          official_attempt_no: submissionDetail.official_attempt_no,
          submitted_at_utc: submissionDetail.submitted_at_utc, actions: [],
        };
        return { ok: true, status: 201, async json() { return envelope({ receipt, submission }); } };
      }
      return { ok: false, status: 404, async json() { return { message: 'fixture route missing' }; } };
    };
  </script>
