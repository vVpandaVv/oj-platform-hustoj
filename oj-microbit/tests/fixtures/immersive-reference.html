      q('.mr-running-state').append(dot, document.createTextNode(a.expected?'기대 동작 · 화면 시연':a.paused?'일시정지 · 화면 시연':'실행 중 · 화면 시연'));
      q('.mr-pause').setAttribute('aria-label',a.paused?'계속 실행':'일시정지');

      q('.mr-expected-tab').setAttribute('aria-pressed',String(a.expected));

      tweak.addToggle(a,'open',{label:design==='guide'?'실행 단계 보기':'실행 결과 펼치기'});
    }
  }
  root.querySelectorAll('.mr-app').forEach(init);
  window.addEventListener('openai:set_globals',event=>{
    const incoming=event.detail?.globals?.widgetState;
    const screens=incoming?.privateContent?.screens || incoming?.screens;
    if(!screens)return;
    apps.forEach(a=>{const v=screens[a.design];if(!v)return;['role','open','stage','edit','sensor','expected','paused'].forEach(k=>{if(v[k]!==undefined)a[k]=v[k];});a.render();});
  });
  let previous=0,angle=0;
  const reduced=window.matchMedia('(prefers-reduced-motion: reduce)');
  function animate(time) {
    const delta=Math.min(50,time-previous || 16);previous=time;
    apps.forEach(a=>{if(a.el.closest('[data-variant]').hidden || a.role!=='student' || !a.open || reduced.matches || !a.animated)return;const value=a.expected?a.sensor:a.actual; if((!a.paused||a.expected)&&value>0){angle=(angle+delta*(value/1023)*.4)%360;const rotor=a.el.querySelector('.mr-rotor svg');if(rotor)rotor.style.transform='rotate('+angle+'deg)';}});
    window.requestAnimationFrame(animate);
  }
  window.requestAnimationFrame(animate);
  icons();
})();
</script>
